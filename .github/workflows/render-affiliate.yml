name: Render Affiliate Videos

# ============================================================
# Auto Affiliate Factory (V5) — Short-Video Engine
# Upstream: https://github.com/harry0703/MoneyPrinterTurbo
# Pinned SHA: b42e945b497176c823579f9b1895d9323446de23
# ============================================================

on:
  workflow_dispatch:
    inputs:
      product_json:
        description: "JSON sản phẩm hoặc đường dẫn tới file JSON (ví dụ: storage/products/sample_product.json)"
        required: true
        type: string
        default: "storage/products/sample_product.json"
      duration_seconds:
        description: "Thời lượng mục tiêu (giây)"
        required: true
        default: "15"
        type: choice
        options:
          - "15"
          - "20"
          - "30"
      voice:
        description: "Giọng đọc (Edge TTS chuẩn tiếng Việt)"
        required: true
        default: marin
        type: choice
        options:
          - marin
          - onyx

permissions:
  contents: read

jobs:
  render_affiliate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up ffmpeg & ffprobe
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: "release"

      - name: Verify ffmpeg & tools
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip uv
          uv pip install --system -e .

      - name: Plan 3 Affiliate Variants
        id: plan
        env:
          INPUT_PRODUCT_JSON: ${{ inputs.product_json }}
          INPUT_DURATION: ${{ inputs.duration_seconds }}
        run: |
          mkdir -p affiliate_staging
          # Check if input is a file path or raw JSON safely
          if [ -f "$INPUT_PRODUCT_JSON" ]; then
            cp "$INPUT_PRODUCT_JSON" affiliate_staging/product.json
          else
            printf '%s' "$INPUT_PRODUCT_JSON" > affiliate_staging/product.json
          fi
          python -m auto_video_factory.affiliate plan \
            --product affiliate_staging/product.json \
            --duration "$INPUT_DURATION" \
            --output-dir affiliate_staging

      - name: Clone MoneyPrinterTurbo (Pinned SHA)
        run: |
          git clone --depth 1 https://github.com/harry0703/MoneyPrinterTurbo.git mpt_repo || git clone https://github.com/harry0703/MoneyPrinterTurbo.git mpt_repo
          cd mpt_repo
          git fetch --depth 1 origin b42e945b497176c823579f9b1895d9323446de23 || true
          git checkout b42e945b497176c823579f9b1895d9323446de23
          cd ..
          mkdir -p mpt_repo/resource/fonts
          NOTO_FONT=$(find /usr/share/fonts -name "*Sans*.ttf" -o -name "*DejaVu*.ttf" -o -name "*Noto*.ttf" 2>/dev/null | head -n 1)
          if [ -n "$NOTO_FONT" ] && [ -f "$NOTO_FONT" ]; then
            cp "$NOTO_FONT" mpt_repo/resource/fonts/NotoSans-Bold.ttf
            echo "Installed subtitle font from $NOTO_FONT to mpt_repo/resource/fonts/NotoSans-Bold.ttf"
          else
            echo "::warning::Subtitle font not found in /usr/share/fonts, using MPT fallback"
          fi
          # Install MPT dependencies
          uv pip install --system -r mpt_repo/requirements.txt

      - name: Initialize MPT config.toml
        run: |
          python - << 'PYEOF'
          from pathlib import Path
          from auto_video_factory.mpt_adapter import build_config_toml
          cfg_content = build_config_toml(font_name="NotoSans-Bold.ttf")
          Path("mpt_repo/config.toml").write_text(cfg_content, encoding="utf-8")
          print("mpt_repo/config.toml initialized successfully.")
          PYEOF

      - name: Stage Media & Render 3 Affiliate Variants
        env:
          INPUT_DURATION: ${{ inputs.duration_seconds }}
          INPUT_VOICE: ${{ inputs.voice }}
        run: |
          mkdir -p affiliate-output
          # Copy metadata pack to output
          cp affiliate_staging/affiliate_pack.json affiliate-output/metadata.json

          python - << 'PYEOF'
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          from auto_video_factory.affiliate import (
              AffiliateMediaStager,
              plan_affiliate_pack,
              validate_product_input,
          )
          from auto_video_factory.mpt_adapter import (
              build_cli_args,
              locate_output_video,
          )

          prod_data = json.loads(Path("affiliate_staging/product.json").read_text(encoding="utf-8"))
          product = validate_product_input(prod_data)
          target_duration = int(os.environ.get("INPUT_DURATION", "15"))
          voice = os.environ.get("INPUT_VOICE", "marin")
          pack = plan_affiliate_pack(product, duration_seconds=target_duration)
          stager = AffiliateMediaStager()

          mpt_dir = Path("mpt_repo")

          for variant in pack.variants:
              var_name = variant.variant_type.value
              stage_dir = Path(f"affiliate_staging/{var_name}_media").resolve()
              clips = stager.stage_media_for_variant(product, variant, stage_dir, base_dir=Path("."))
              print(f"Staged {len(clips)} clips for variant {var_name} in {stage_dir}")

              materials_str = ",".join(str(c.resolve()) for c in clips)
              clip_dur = int(variant.scenes[0].duration_seconds) if variant.scenes else 5
              render_args = build_cli_args(
                  topic=product.title,
                  duration=str(target_duration),
                  voice=voice,
                  video_source="local",
                  video_materials=materials_str,
                  video_clip_duration=clip_dur,
                  video_script=variant.voice_script,
              )

              # Execute MPT CLI render
              cmd = [sys.executable, "cli.py"] + render_args
              print(f"Rendering variant {var_name}...")
              res = subprocess.run(cmd, cwd=str(mpt_dir), capture_output=True, text=True)
              if res.stdout:
                  print(res.stdout)
              if res.stderr:
                  print(res.stderr, file=sys.stderr)
              if res.returncode != 0:
                  print(f"::error::MPT render failed for variant {var_name} with exit code {res.returncode}")
                  sys.exit(res.returncode)

              task_id = None
              if res.stdout:
                  for line in res.stdout.splitlines():
                      if "task_id" in line:
                          try:
                              start = line.find("{")
                              end = line.rfind("}")
                              if start != -1 and end != -1:
                                  d = json.loads(line[start : end + 1])
                                  if "task_id" in d:
                                      task_id = d["task_id"]
                          except Exception:
                              pass

              out_video = locate_output_video(str(mpt_dir), task_id=task_id)
              dst_video = Path(f"affiliate-output/{var_name}.mp4")
              shutil.copy2(out_video, dst_video)
              print(f"Successfully generated {dst_video} ({dst_video.stat().st_size} bytes)")
          PYEOF

      - name: Verify Affiliate Output
        run: |
          echo "Affiliate pack artifacts generated:"
          ls -la affiliate-output/
          if [ ! -f "affiliate-output/metadata.json" ]; then
            echo "::error::metadata.json missing!"
            exit 1
          fi
          for variant in problem_solution three_reasons comparison_highlight; do
            if [ ! -s "affiliate-output/${variant}.mp4" ]; then
              echo "::error::Missing or empty video: affiliate-output/${variant}.mp4"
              exit 1
            fi
          done
          echo "All 3 affiliate videos and metadata.json verified successfully."

      - name: Upload Affiliate Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-output
          path: affiliate-output/
          retention-days: 1
