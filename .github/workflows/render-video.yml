name: Auto Video Factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Chủ đề / ý tưởng video"
        required: true
        type: string
      duration_seconds:
        description: "Độ dài mục tiêu"
        required: true
        default: "60"
        type: choice
        options:
          - "45"
          - "60"
          - "90"
      voice:
        description: "Giọng kể"
        required: true
        default: marin
        type: choice
        options:
          - marin
          - onyx
      style:
        description: "Phong cách hình"
        required: true
        default: xianxia-cinematic
        type: choice
        options:
          - xianxia-cinematic
          - ink-wash
          - dark-fantasy
      provider:
        description: "AI thật hoặc smoke miễn phí"
        required: true
        default: openai
        type: choice
        options:
          - openai
          - offline

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOPIC: ${{ inputs.topic }}
      DURATION_SECONDS: ${{ inputs.duration_seconds }}
      VOICE: ${{ inputs.voice }}
      STYLE: ${{ inputs.style }}
      PROVIDER: ${{ inputs.provider }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak fonts-dejavu-core

      - name: Install Auto Video Factory
        run: python -m pip install .

      - name: Validate AI secret
        if: ${{ inputs.provider == 'openai' }}
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Thiếu repository secret OPENAI_API_KEY"
            exit 2
          fi

      - name: Render
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p output/github
          auto-video-factory \
            --topic "$TOPIC" \
            --output output/github \
            --duration-seconds "$DURATION_SECONDS" \
            --provider "$PROVIDER" \
            --tts-voice "$VOICE" \
            --style "$STYLE" \
            --width 720 \
            --height 1280 \
            --fps 30 \
            | tee output/github/result.json

      - name: Verify output video
        shell: bash
        run: |
          test -s output/github/video.mp4 || { echo "::error::Output video.mp4 missing or empty"; exit 1; }

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: auto-video-output
          path: |
            output/github/video.mp4
            output/github/captions.srt
            output/github/result.json
          if-no-files-found: error
          retention-days: 1
