[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-video-factory"
version = "0.3.2"
description = "Automated vertical storytelling video pipeline"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "fastapi>=0.128", "uvicorn>=0.48"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
# Production Flow provider: pip install "auto-video-factory[prod]"
# Pinned to exact commit on eddie-fqh/flow-py (PRODUCTION_CORE upstream).
# DO NOT substitute google-flow-cli, veo3tool, or veo-automation-extension.
prod = [
    "flow-py @ git+https://github.com/eddie-fqh/flow-py.git@bd01679304d6fccc4c96fea3b33151c2e9e836f4",
    "playwright>=1.40.0",
]

[project.scripts]
auto-video-factory = "auto_video_factory.cli:main"
auto-video-factory-web = "auto_video_factory.web:main"
flow-planner = "auto_video_factory.flow_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["auto_video_factory"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.setuptools.package-data]
auto_video_factory = ["webui/*.html"]

[tool.setuptools.packages.find]
include = ["auto_video_factory*"]
exclude = ["tests*", "evals*", "output*"]
